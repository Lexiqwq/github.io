<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Heart wave</title>
    <style>
  body { 
    background-image: url("bgpainting.jpg");
    background-repeat: no-repeat;
    background-size:cover;
    text-align: center;

  canvas {
    display: block;
    margin: auto;

    }

  }
    
</style>
  </head>  
  <body>
    <canvas id="canvas" width="1000" height="700">
    </canvas>

    
    <script src="utils.js"></script>
    <!-- <script src="./classes/pelota.js"></script> -->
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          
          //ball = new Pelota(),
          fondo = new Image ();
          pelota = new Image(),
          angle = 0,
          angle2=60,
          centerScale = .50,
          range = .099,
          escalaX = 1,
          escalaY = 1,
          speed = 0.03,
          speed2 = 0.03,
          posicionX = 0,
          posicionY = 0,
          centerY = 0,
          rangeY = 100,
          rangeX = 100,
          speedX = 2;
          fondo.src = "Jardin.jpg"
          pelota.src = "bee.png";

          fondo.onload = function() {
    // Comenzar animación cuando el fondo esté cargado
      requestAnimationFrame(drawFrame);
       };
        
      //ball.x = canvas.width / 2;
      //ball.y = canvas.height / 2;
        var dashOffset = 0;
      

      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.drawImage(fondo,0, 0, canvas.width, canvas.height);

      

      context.save();

      context.setLineDash([15, 5]);    
        dashOffset -= 2;
      context.lineDashOffset = dashOffset;
      context.lineWidth = 5.5;
      context.strokeStyle = "#FFFFFF";
      

      context.strokeRect(0, 0, canvas.width, canvas.height);

      context.restore(); 

        context.save();
        context.translate(0, 200);
        escalaX = escalaY = centerScale + Math.sin(angle) * range;
        posicionY = centerY / 2 + Math.sin(angle2) * rangeY;
        angle += speed;
        angle2 += speed2;
        posicionX += speedX;
        context.drawImage(pelota, posicionX, posicionY, pelota.width*escalaX, pelota.height*escalaY);
        context.restore();

        if (posicionX + pelota.width * escalaX > canvas.width) {
          posicionX = canvas.width - pelota.width * escalaX; // lo coloca justo en el borde
          speedX = -speedX;
           }
          if (posicionX < 0) {
          posicionX = 0;
          speedX = -speedX;
           }
          posicionX += speedX;

  // Rebote en Y con corrección
          if (posicionY + pelota.height * escalaY > canvas.height) {
          posicionY = canvas.height - pelota.height * escalaY;
          speedY = -speedY;
           }
          if (posicionY < 0) {
          posicionY = 0;
          speedY = -speedY;
           }
          posicionY += speedY;

      

      }());
    };
    </script>
  </body>
</html>
