<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Web Paint</title>
    <style>
      body {
      background-color: rgb(236, 233, 216);
      
      }

      canvas {
        border: 6px solid rgb(123, 123, 123);
        background-color: rgb(255, 255, 255);
        display: block;
        margin: auto;
        background-size:cover;
}
      

       .colores {
        width: 100%;
        height: 50px;
        text-align: center;
      }

      .colores button {
        width: 50px;
        height: 50px;
        border-radius: 6px;
        margin-right: 20px;
        margin-top: 5px;
        border: 1px solid white;
        cursor: pointer;
      }

      #red {
        background: #FF0000;
      }

      #orange {
        background: #FF6F00;
      }

      #yellow {
        background: #FFEA00;
      }

      #green {
        background: #4DFF00;
      }

      #blue {
        background: #0000FF;
      }

.color button:hover{
        opacity:0.5;
      }

.grosor {
        width: 100%;
        height: 100px;
        text-align: center;
      }

.grosor {
        margin-top: 15px;
      }

      #grosor {
        width: 250px;
        cursor: pointer;
      }

      #valorGrosor {
        font: 15px arial;
      }
      #otros {
        width: 100%;
        height: 60px;
        text-align: center;
        margin-left: 4.5px;
        margin-top: 20px;
      }

#otros button {
        width: 100px;
        height: 40px;
        background: #ffffff;
        color: black;
        font: 15px arial;
        cursor: pointer;
        
      }

     .colores button:hover {
      opacity: 0.5;

      }

            #colorPicker {
        width: 69px;
        height: 55px;
        margin-right: 5px;
        margin-top: 5px;
        border: 0.01px solid white;
        cursor: pointer;
      }
      aside {
      text-align: center;
      margin-top: 15px;
      font: 15px Arial;
      }


    </style>
    <canvas id="canvas" width="800" height="500"></canvas>
  </head>
  <body>

  <div class="colores">
    <button id="red" type="button" value="#FF0000"></button>
    <button id="orange" type="button" value="#FF6F00"></button>
    <button id="yellow" type="button" value="#FFEA00"></button>
    <button id="green" type="button" value="#4DFF00"></button>
    <button id="blue" type="button" value="#0000FF"></button>
    <input type="color" id="colorPicker" value="#000000">
  </div>

  <div id="otros">
    <button id="clearCanvas" type="button">Clear</button>
  </div>

  <div class="grosor">
    <label for="grosor">Grosor:</label>
    <input type="range" id="grosor" min="1" max="50" value="50">
    <span id="valorGrosor">1 px</span>
  </div>

  <aside>Click and draw with the mouse.</aside>

    
    <script src="utils.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas);

          context.lineCap = "round";
      canvas.addEventListener('mousedown', function () {
        context.beginPath();
        context.moveTo(mouse.x, mouse.y);
        canvas.addEventListener('mousemove', onMouseMove, false);
      }, false);

      canvas.addEventListener('mouseup', function () {
        canvas.removeEventListener('mousemove', onMouseMove, false);
      }, false);

      function onMouseMove () {
        context.lineTo(mouse.x, mouse.y);
        context.stroke();
      }

      var colores = document.getElementsByClassName('colores')[0];
      colores.addEventListener('click', function(event) {
        context.strokeStyle = event.target.value;
      });

       var grosor = document.getElementById('grosor');
        var valorGrosor = document.getElementById('valorGrosor');

      grosor.addEventListener('input', function () {
        context.lineWidth = grosor.value;
        valorGrosor.textContent = grosor.value + ' px';
      });

       var clearButton = document.getElementById('clearCanvas');
         clearButton.addEventListener('click', function() {
         context.clearRect(0, 0, canvas.width, canvas.height);
        });

       var colorPicker = document.getElementById('colorPicker');

          colorPicker.addEventListener('input', function() {
            context.strokeStyle = colorPicker.value;
          });

    };
    </script>
  </body>
</html>
